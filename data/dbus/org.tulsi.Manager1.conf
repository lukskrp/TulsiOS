<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root (tulsid) may own the name. Anyone may call it: every
     mutating method is authorized by polkit inside tulsid. -->
<busconfig>
  <policy user="root">
    <allow own="org.tulsi.Manager1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.tulsi.Manager1"/>
  </policy>
</busconfig>
