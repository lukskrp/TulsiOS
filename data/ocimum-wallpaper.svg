<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Ocimum Desktop default wallpaper: basil leaves on deep green. -->
  <defs>
    <radialGradient id="bg" cx="0.35" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#1f3b2a"/>
      <stop offset="1" stop-color="#0c1a12"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="1" stop-color="#66bb6a"/>
    </linearGradient>
    <linearGradient id="leafDim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1b5e20" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#43a047" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- background leaves -->
  <g fill="url(#leafDim)">
    <path transform="translate(1420 160) rotate(20)" d="M0 300C0 120 120 0 300 0C300 180 180 300 0 300Z"/>
    <path transform="translate(220 700) rotate(-35)" d="M0 220C0 90 90 0 220 0C220 130 130 220 0 220Z"/>
    <path transform="translate(1650 760) rotate(75)" d="M0 180C0 75 75 0 180 0C180 105 105 180 0 180Z"/>
  </g>
  <!-- main sprig -->
  <g transform="translate(1180 520)">
    <path fill="none" stroke="#2e7d32" stroke-width="10" stroke-linecap="round" d="M0 420C40 300 60 170 140 40"/>
    <path fill="url(#leaf)" d="M140 40C140 -120 260 -230 420 -230C420 -70 300 40 140 40Z"/>
    <path fill="none" stroke="#c8e6c9" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" d="M150 30L400 -210"/>
    <path fill="url(#leaf)" d="M95 200C-60 200 -170 90 -170 -60C-15 -60 95 50 95 200Z"/>
    <path fill="none" stroke="#c8e6c9" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" d="M85 190L-150 -45"/>
    <path fill="url(#leaf)" d="M55 330C55 210 140 125 260 125C260 245 175 330 55 330Z"/>
  </g>
  <text x="96" y="1000" font-family="sans-serif" font-size="36" fill="#a5d6a7" fill-opacity="0.55">TulsiOS</text>
</svg>
