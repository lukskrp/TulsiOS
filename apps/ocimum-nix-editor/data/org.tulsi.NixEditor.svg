<?xml version="1.0" encoding="UTF-8"?>
<!-- Nix Editor (ADR 0019): code on the left, the guide's column with a tulsi leaf on
     the right. TulsiOS colours: navy #364b66, teal #11a09a. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Nix Editor</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42597a"/>
      <stop offset="1" stop-color="#2c3e55"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- the code: a brace and lines, the first a keyword -->
  <path d="M37 30 C30 30 29 34 29 40 L29 56 C29 61 27 64 22 64 C27 64 29 67 29 72 L29 88 C29 94 30 98 37 98"
        fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="38" width="22" height="6" rx="3" fill="#11a09a"/>
  <rect x="42" y="52" width="16" height="6" rx="3" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="48" y="66" width="18" height="6" rx="3" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="42" y="80" width="12" height="6" rx="3" fill="#ffffff" fill-opacity="0.85"/>

  <!-- the guide's column, with a tulsi leaf -->
  <rect x="73" y="24" width="37" height="80" rx="9" fill="#ffffff" fill-opacity="0.14"/>
  <path d="M91.5 34 C79 42 78.5 60 91.5 70 C104.5 60 104 42 91.5 34 Z" fill="#11a09a"/>
  <path d="M91.5 40 L91.5 66" fill="none" stroke="#2c3e55" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M91.5 51 L86 46 M91.5 58 L97 53" fill="none" stroke="#2c3e55" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.45"/>
  <rect x="79" y="80" width="25" height="4.5" rx="2.25" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="79" y="89" width="17" height="4.5" rx="2.25" fill="#ffffff" fill-opacity="0.7"/>
</svg>
