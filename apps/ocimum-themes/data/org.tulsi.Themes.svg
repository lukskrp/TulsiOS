<?xml version="1.0" encoding="UTF-8"?>
<!-- Themes (ADR 0021): a painter's palette of swatches on the TulsiOS tile, the
     thumb hole a tulsi leaf. TulsiOS colours: navy #364b66, leaf #3f8a4f. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Themes</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42597a"/>
      <stop offset="1" stop-color="#2c3e55"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- the palette board -->
  <path d="M64 24 C38 24 20 41 20 63 C20 85 37 102 58 102 C66 102 69 97 67 91 C65 85 68 80 75 80 L86 80 C98 80 108 72 108 59 C108 39 88 24 64 24 Z"
        fill="#f4f1ea"/>
  <!-- swatches -->
  <circle cx="44" cy="52" r="8.5" fill="#e06c6c"/>
  <circle cx="62" cy="40" r="8.5" fill="#d9b66a"/>
  <circle cx="83" cy="44" r="8.5" fill="#6f9fd8"/>
  <circle cx="40" cy="74" r="8.5" fill="#b88ac9"/>
  <!-- the thumb hole, a tulsi leaf -->
  <path d="M88 52 C79 57 78.5 69 88 75 C97.5 69 97 57 88 52 Z" fill="#3f8a4f"/>
  <path d="M88 55 L88 72" stroke="#2c6a3b" stroke-width="1.6" stroke-linecap="round"/>
</svg>
