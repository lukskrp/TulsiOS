[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ocimum-assistant"
version = "0.1.0"
description = "Ocimum Assistant: change TulsiOS in plain language (via tulsi-mcp, with approval)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyGObject", "anthropic>=1.0"]

[project.scripts]
ocimum-assistant = "ocimum_assistant.app:main"

[tool.setuptools.packages.find]
include = ["ocimum_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
