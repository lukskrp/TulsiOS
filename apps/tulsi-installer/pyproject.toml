[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tulsi-installer"
version = "0.1.0"
description = "tulsi-install-system: installs TulsiOS onto a mounted root (used by Calamares)"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
tulsi-install-system = "tulsi_installer.cli:main"

[tool.setuptools.packages.find]
include = ["tulsi_installer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
