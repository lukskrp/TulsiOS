# Upstream calamares-nixos-extensions 0.3.23's partition.conf, with btrfs as the
# default file system (ADR 0027): home folders can then keep a history of
# snapshots, if the person turns it on in the Welcome window. mount.conf (upstream)
# makes the "home" and "nix" subvolumes, mounted with zstd compression.
# https://codeberg.org/Calamares/calamares/src/branch/calamares/src/modules/partition/partition.conf
efi:
    mountPoint: "/boot"
    recommendedSize: 1GiB
    minimumSize: 32MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend

luksGeneration: luks2

defaultFileSystemType: "btrfs"

availableFileSystemTypes:
    - btrfs
    - ext4
    - xfs
    - f2fs

showNotEncryptedBootMessage: false

partitionLayout:
    - name: "root"
      filesystem: "unknown"
      noEncrypt: false
      mountPoint: "/"
      size: 100%
