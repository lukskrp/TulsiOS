# The "Extra software" page (ADR 0032): software downloaded during the installation
# if the person ticks it. Each id ends up in /etc/nixos/tulsi/state.json's packages
# (an ordinary Software Center package, removable later); tulsios-online checks the
# connection before anything is written to the disk.
mode: optional
method: legacy

labels:
    step: "Extra software"

items:
    - id: libreoffice
      packages: [ libreoffice ]
      name: LibreOffice
      description: "<html>LibreOffice, the office suite: Writer for documents, Calc for spreadsheets, Impress for presentations, Draw and more. It opens and saves Microsoft Office files too.<br/>
                    <br/>
                    <b>Needs an internet connection:</b> LibreOffice is downloaded during the installation (about 300 MB). You can also install it later from the Software Center.<br/>
                    <br/>
                    LibreOffice is free software, made by The Document Foundation and thousands of volunteers. If you find it useful, consider supporting their work: <a href=\"https://www.libreoffice.org/donate/\">https://www.libreoffice.org/donate/</a></html>"
