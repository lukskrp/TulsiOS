# The "Extra software" page (ADR 0032, 0034): software downloaded during the installation
# if the person ticks it. Each id ends up in /etc/nixos/tulsi/state.json's packages
# (an ordinary Software Center package, removable later); tulsios-online checks the
# connection before anything is written to the disk.
mode: optionalmultiple
method: legacy

labels:
    step: "Extra software"

items:
    - id: libreoffice
      packages: [ libreoffice ]
      name: LibreOffice
      description: "<html>LibreOffice, the office suite: Writer for documents, Calc for spreadsheets, Impress for presentations, Draw and more. It opens and saves Microsoft Office files too.<br/>
                    <br/>
                    <b>Needs an internet connection:</b> LibreOffice is downloaded during the installation (about 300 MB). You can also install it later from the Software Center.<br/>
                    <br/>
                    LibreOffice is free software, made by The Document Foundation and thousands of volunteers. If you find it useful, consider supporting their work: <a href=\"https://www.libreoffice.org/donate/\">https://www.libreoffice.org/donate/</a></html>"

    - id: bottles
      packages: [ bottles ]
      name: Bottles (Windows programs)
      description: "<html>Bottles runs Windows programs. Each lives in its own bottle, with the right version of Wine or Proton and the Windows components it needs, and snapshots to go back to if an installer breaks something. Double-click a .exe or .msi to open it in Bottles.<br/>
                    <br/>
                    <b>Needs an internet connection:</b> Bottles is downloaded during the installation (about 1 GB, with its runtime). You can also install it later from the Software Center.<br/>
                    <br/>
                    Windows programs run as you, with access to your files: install only programs you trust. Bottles is free software by its community: <a href=\"https://usebottles.com/funding/\">https://usebottles.com/funding/</a></html>"

    - id: lutris
      packages: [ lutris-free ]
      name: Lutris (games)
      description: "<html>Lutris plays games from GOG, Epic, Steam, Humble and more in one library, with Wine, Proton and emulators, and installer scripts made by its community.<br/>
                    <br/>
                    <b>Needs an internet connection:</b> Lutris is downloaded during the installation. You can also install it later from the Software Center.</html>"

    - id: msfonts
      packages: [ ]
      name: Microsoft fonts
      description: "<html>Arial, Times New Roman, Verdana, Courier New and Microsoft's other core fonts, so documents and websites made on Windows look as intended.<br/>
                    <br/>
                    <b>Needs an internet connection:</b> they are downloaded during the installation.<br/>
                    <br/>
                    These fonts are not free software: ticking this turns on unfree software for the whole system (the Software Center can then install unfree apps too).</html>"
