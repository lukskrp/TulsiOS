# The "Media" page (ADR 0035): the common codecs are on unless the person picks
# patent-free formats only. The choice ends up as tulsi.codecs.enable in
# /etc/nixos/configuration.nix (`tulsi config` changes it later).
mode: required
method: legacy

labels:
    step: "Media"

default: codecs

items:
    - id: codecs
      packages: [ ]
      name: Play all common media (recommended)
      description: "<html>Music and videos in every common format play in every app: MP3, AAC, H.264, H.265 and more. DVDs play, and RAR and 7z archives open.<br/>
                    <br/>
                    Some of these formats are covered by software patents in a few countries. You can turn them off later in the Welcome window or with <tt>tulsi config</tt>.</html>"

    - id: free
      packages: [ ]
      name: Patent-free formats only
      description: "<html>Only formats free of patents: Ogg, Opus, FLAC, WebM, AV1 and others. The video player still plays most videos; other apps may not play MP3s or MP4s until you turn the codecs on (Welcome window, or <tt>tulsi config</tt>).</html>"
