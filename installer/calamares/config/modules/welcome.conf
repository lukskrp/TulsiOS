# TulsiOS installs from the ISO itself; the internet is checked but not required.
showReleaseNotesUrl: false
requirements:
    requiredStorage: 20
    requiredRam: 2.0
    internetCheckUrl: [ https://cache.nixos.org/ ]
    check:
        - storage
        - ram
        - power
        - internet
        - screen
    required:
        - storage
        - ram
