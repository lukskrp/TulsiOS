# The desktop page: Ocimum Desktop or dwm. Only the chosen one is installed;
# the choice ends up as tulsi.desktop.session in /etc/nixos/configuration.nix.
mode: required
method: legacy

labels:
    step: "Desktop"

default: ocimum

items:
    - id: ocimum
      packages: [ ocimum ]
      name: Ocimum Desktop
      description: "<html>The TulsiOS desktop: a panel with a start menu, windows you move and resize, and System Settings for everything. The Software Center and the Assistant are pinned to the panel; Super+A opens the Assistant.<br/>
                    <br/>
                    Pick this if you are not sure.</html>"

    - id: dwm
      packages: [ dwm ]
      name: dwm (tiling)
      description: "<html>dwm, the suckless tiling window manager, with a system tray. Windows are arranged for you and everything is done from the keyboard: Super+Shift+Return opens a terminal, Super+P runs a program, Super+A opens the Assistant, Super+S the Software Center.<br/>
                    <br/>
                    For people who already like tiling window managers.</html>"
