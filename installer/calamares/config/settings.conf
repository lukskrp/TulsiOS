# Calamares for TulsiOS (ADR 0016). Based on calamares-nixos-extensions (MIT).
# The upstream `nixos` job is replaced by `tulsios`, which hands the answers to
# tulsi-install-system; the desktop page offers Ocimum Desktop, SonicDE or dwm.
# tulsios-online runs first: SonicDE, and the extra software (LibreOffice) ticked on
# the "Extra software" page, come from the TulsiOS cache, not the ISO.
---
modules-search: [ local, @out@/lib/calamares/modules ]

instances:
- module:   tulsios
  weight:   48
- id:       extras
  module:   packagechooser
  config:   packagechooser-extras.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - users
  - packagechooser
  - packagechooser@extras
  - partition
  - summary
- exec:
  - tulsios-online
  - partition
  - mount
  - tulsios
  - users
  - umount
- show:
  - finished

branding: tulsios

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
