[workspace]
resolver = "2"
members = [
    "crates/tulsi-state",
    "crates/tulsid",
    "crates/tulsi-cli",
    "crates/tulsi-mcp",
    "crates/ocimum-software-center",
    "crates/ocimum-assistant",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tulsi-state = { path = "crates/tulsi-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
