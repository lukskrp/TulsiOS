[workspace]
resolver = "2"
members = [
    "crates/tulsi-state",
    "crates/tulsi-client",
    "crates/tulsid",
    "crates/tulsi-cli",
    "crates/tulsi-extwatch",
    "crates/tulsi-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tulsi-state = { path = "crates/tulsi-state" }
tulsi-client = { path = "crates/tulsi-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "fs", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
