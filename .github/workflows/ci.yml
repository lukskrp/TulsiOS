name: CI
on:
  push:
    # stable: the release branch installed machines follow (ADR 0017).
    branches: [main, stable]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The runner dies mid-check with "hosted runner lost communication" when
      # the disk fills or the VM tests starve it; both long runs did.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            # Two NixOS VM tests at a time: each QEMU eats a couple of GB, and
            # four at once starves the runner agent.
            max-jobs = 2
            # The unfree printer drivers (checks.printing-scanning) are not on
            # cache.nixos.org, and their upstream mirrors (bchemnet, canon,
            # sourceforge) serve bad bodies often enough to fail the hash check.
            # They come from the TulsiOS cache instead.
            extra-substituters = https://cache.skarptech.org/tulsi
            extra-trusted-public-keys = tulsi:kyxaHhnwTqig/QD918khKlj2eX70SRcLBdv7hl1miw0=
      - run: nix flake check -L
